[workspace]
members = [
  "crates/sacho",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Hong Minhee <hong@minhee.org>"]
license = "GPL-3.0-only"
readme = "README.md"
homepage = "https://github.com/dahlia/sacho"
repository = "https://github.com/dahlia/sacho"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
