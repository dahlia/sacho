min_version = "2026.6.15"

[settings]
experimental = true

[tools]
"aqua:dahlia/hongdown" = "0.5.3"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:nushell/nushell" = "0.114.0"
"aqua:rhysd/actionlint" = "1.7.12"
jj = "0.43.0"
node = "24.18.0"
"pipx:mercurial" = "7.2.3"

[tools."cargo:cargo-mutants"]
version = "27.1.0"
os = ["linux", "macos", "windows/x64"]

[tools.rust]
version = "1.96.1"
profile = "default"
components = "rust-analyzer,rustfmt,clippy"

[deps.cargo]
auto = true
description = "Fetch Rust dependencies"
sources = ["Cargo.toml", "Cargo.lock", "crates/*/Cargo.toml"]
outputs = ["."]
run = """
nu -c "
  if not ('Cargo.toml' | path exists) { exit 0 }
  if ('Cargo.lock' | path exists) { cargo fetch --locked } else { cargo fetch }
"
"""

[hooks.postinstall]
shell = "nu -c"
run = """
mise deps
mise generate git-pre-commit --write --task=check
'#!/bin/sh
cargo run hook-commit-msg "$1"' | save --force .git/hooks/commit-msg
'#!/bin/sh
if test "$1" = prepared; then
  sacho_state=$(git rev-parse --git-path sacho-commit-state) || exit $?
  if test -f "$sacho_state"; then
    cargo run hook-reference-transaction "$1"
  fi
fi' | save --force .git/hooks/reference-transaction
if $nu.os-info.name != 'windows' {
  chmod +x .git/hooks/commit-msg .git/hooks/reference-transaction
}
"""

[tasks.check]
description = "Run type check, lint, and check Markdown format"
depends = ["check:package", "docs:install"]
run = [
  "actionlint",
  "cargo check",
  "cargo clippy",
  "cargo fmt --check",
  "hongdown --check",
  "mise fmt --check",
  "npm test --prefix npm",
  "npm pack --dry-run --json ./npm",
  "npm run --prefix docs build",
  "cargo run check",
]

[tasks."check:package"]
description = "Verify the crate package and its embedded license"
shell = "nu -c"
run = [
  # Cargo packages this nested crate without files from the workspace root.
  # Keep the crate-local copy explicit and fail before publishing if it drifts.
  '''
  let root_license = open --raw LICENSE
  let crate_license = open --raw crates/sacho/LICENSE
  if $root_license != $crate_license {
    error make {
      msg: "crates/sacho/LICENSE must match LICENSE"
      help: "Copy the root license into the crate before packaging."
    }
  }
  ''',
  "cargo package --allow-dirty --locked --package sacho",
]

[tasks.fmt]
description = "Format code and docs"
run = ["cargo fmt", "hongdown --write", "mise fmt"]

[tasks.build]
description = "Build the Rust project"
run = "cargo build --workspace"

[tasks.test]
description = "Run the Rust tests"
run = "cargo test --workspace"

[tasks."test:vcs"]
description = "Run live VCS adapter and repository URL smoke tests"
run = [
  "cargo test --workspace vcs::tests:: -- --ignored",
  "cargo test --workspace repository_url::tests:: -- --ignored",
]

[tasks.mutants]
description = "Run mutation tests"
run = "cargo mutants --workspace"

[tasks.run]
description = "Run the Rust project"
raw_args = true
run = "cargo run --package sacho --"

[tasks."docs:install"]
description = "Install documentation dependencies"
run = "npm ci --prefix docs"
sources = ["docs/package.json", "docs/package-lock.json"]
outputs = ["docs/node_modules/.package-lock.json"]

[tasks."docs:dev"]
description = "Run the documentation development server"
depends = ["docs:install"]
raw = true
run = "npm run --prefix docs dev --"

[tasks."docs:build"]
description = "Build the documentation site"
depends = ["docs:install"]
run = "npm run --prefix docs build"

[tasks."docs:preview"]
description = "Preview the built documentation site"
depends = ["docs:build"]
raw = true
run = "npm run --prefix docs preview --"
