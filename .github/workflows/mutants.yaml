name: Mutation tests

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: "0"
  MISE_NO_HOOKS: "1"

jobs:
  mutants:
    name: Mutation tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.7.7
          install_args: rust cargo:cargo-mutants
          experimental: true
      - name: Run mutation tests
        run: mise mutants
