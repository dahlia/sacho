name: Mutation tests

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_ENABLE_TOOLS: rust,aqua:nushell/nushell,cargo:cargo-mutants
  MISE_NO_HOOKS: "1"
  MISE_TOOLSET: mutants

jobs:
  mutants:
    name: Mutation tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.7.7
          cache_key: "{{default}}-{{env.MISE_TOOLSET}}"
          experimental: true
      - name: Run mutation tests
        run: mise mutants
